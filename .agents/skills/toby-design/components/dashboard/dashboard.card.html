<!-- @dsCard group="Components" viewport="700x420" name="Dashboard" subtitle="Block card, flow runner, onboarding tiles" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>Dashboard</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.417.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-content);font-family:var(--font-system);color:var(--text-body)}#root{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}a{color:var(--text-accent)}a:hover{color:var(--text-body)}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const { DashboardCard, CardSection, FlowRunnerCard, OnboardingTile, IconButton } = window.TobyDesignSystem_28de33;
const I = ({n,s=14}) => <i data-lucide={n} style={{width:s,height:s,display:'inline-flex'}}></i>;
function Card(){
  React.useEffect(()=>{lucide.createIcons();});
  return <React.Fragment>
    <DashboardCard title="Unread mail" lastRan="07:15" showMore
      stamp={<I n="mail" s={120}/>}
      actions={<React.Fragment>
        <IconButton label="Refresh" filled={false} tone="faint" size="sm" glyph={<I n="refresh-cw" s={11}/>}/>
        <IconButton label="Actions" filled={false} tone="faint" size="sm" glyph={<I n="ellipsis" s={11}/>}/>
      </React.Fragment>}>
      <CardSection label="Needs attention">Priya asked for the signed renewal before Friday — the thread has been open since Thursday and nobody has replied.</CardSection>
      <CardSection label="Worth noting">Two CI failure digests, and a design-review invite for Thursday that conflicts with your 1:1.</CardSection>
      <CardSection label="Ignore">Nine newsletters and three receipts.</CardSection>
    </DashboardCard>
    <div style={{display:'flex',flexDirection:'column',gap:20}}>
      <div style={{height:200}}>
        <FlowRunnerCard title="Weekly review" stamp={<I n="git-branch" s={120}/>}
          description="Collects last week's shipped work, open tasks, and calendar into one summary you can paste into a status update."/>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
        <OnboardingTile upNext title="Connect an integration" subtitle="Email, Slack, Jira, Todoist, or Apple Calendar." actionLabel="Connect" glyph={<I n="grid-2x2" s={15}/>}/>
        <OnboardingTile complete title="Set up AI" subtitle="Provider and model chosen." glyph={<I n="sparkles" s={15}/>}/>
      </div>
    </div>
  </React.Fragment>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
</script></body></html>
