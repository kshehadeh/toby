<!-- @dsCard group="Components" viewport="960x560" name="Dashboard" subtitle="Home cards, actions tiles, onboarding" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Dashboard</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.417.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-content);font-family:var(--font-system);color:var(--text-body)}.lbl{font-size:10px;color:var(--text-faint);margin-bottom:8px}#root{padding:24px;display:flex;flex-direction:column;gap:24px;max-width:940px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const I = ({n,s=14}) => <i data-lucide={n} style={{width:s,height:s,display:'inline-flex'}}></i>;
const { DashboardCard, CardSection, FlowRunnerCard, OnboardingTile } = window.TobyDesignSystem_28de33;
function Card(){
  React.useEffect(()=>{lucide.createIcons();});
  return <React.Fragment>
    <div>
      <div style={{fontSize:'var(--size-greeting)',fontWeight:700,letterSpacing:'var(--tracking-greeting)'}}>Good morning, Karim</div>
      <div style={{fontSize:13,color:'var(--text-muted)',marginTop:3}}>Friday, September 18</div>
    </div>
    <div className="grid">
      <DashboardCard title="Unread mail" glyph={<I n="mail"/>} lastRan="9/18/26 07:08">
        <CardSection label="Needs attention" items={[{title:'Priya: signed renewal before Friday',subtitle:'Open since Thursday, no reply yet'},{title:'Design review invite',subtitle:'Conflicts with your 1:1'}]}/>
        <CardSection label="Ignore">Nine newsletters and three receipts.</CardSection>
      </DashboardCard>
      <div style={{display:'flex',flexDirection:'column',gap:20}}>
        <DashboardCard title="Tasks" glyph={<I n="list-todo"/>}>No tasks found. Connect a task provider to see open tasks.</DashboardCard>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
          <FlowRunnerCard title="Weekly review" glyph={<I n="git-branch" s={15}/>}/>
          <FlowRunnerCard title="Morning briefing" glyph={<I n="sun" s={15}/>} color="var(--toby-accent-blue)"/>
          <FlowRunnerCard title="Triage inbox" glyph={<I n="inbox" s={15}/>} color="var(--toby-accent-purple)"/>
        </div>
      </div>
    </div>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
      <OnboardingTile upNext title="Connect an integration" subtitle="Email, Slack, Jira, Todoist, or Apple Calendar." actionLabel="Connect" glyph={<I n="grid-2x2" s={15}/>}/>
      <OnboardingTile title="Create a schedule" subtitle="Run a prompt every morning." actionLabel="Create" glyph={<I n="calendar" s={15}/>}/>
      <OnboardingTile complete title="Set up AI" subtitle="Provider and model chosen." glyph={<I n="sparkles" s={15}/>}/>
    </div>
  </React.Fragment>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
requestAnimationFrame(()=>lucide.createIcons());
</script></body></html>
