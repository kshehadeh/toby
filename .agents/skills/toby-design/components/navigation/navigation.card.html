<!-- @dsCard group="Components" viewport="560x400" name="Navigation" subtitle="Sidebar destinations, browser rows, persona footer" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Navigation</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.417.0/dist/umd/lucide.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-content);font-family:var(--font-system);color:var(--text-body)}.lbl{font-size:10px;color:var(--text-faint);margin-bottom:8px}#root{padding:16px;display:grid;grid-template-columns:250px 260px;gap:16px}.panel{border-radius:18px;background:var(--surface-sidebar);padding:10px 10px 8px;display:flex;flex-direction:column;min-height:360px}.col{border-radius:12px;background:var(--surface-settings-canvas);padding:8px 10px;display:flex;flex-direction:column;gap:2px}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const I = ({n,s=14}) => <i data-lucide={n} style={{width:s,height:s,display:'inline-flex'}}></i>;
const { SidebarSection, SidebarRow, PersonaFooter } = window.TobyDesignSystem_28de33;
function Card(){
  const [route,setRoute]=React.useState('home');
  const [row,setRow]=React.useState('cal');
  React.useEffect(()=>{lucide.createIcons();});
  const d=(id,title,icon)=><SidebarRow key={id} variant="destination" title={title} glyph={<I n={icon} s={15}/>} selected={route===id} onClick={()=>setRoute(id)}/>;
  return <React.Fragment>
    <div className="panel">
      <SidebarSection>{[d('home','Home','house'),d('chat','Chats','message-circle'),d('projects','Projects','folder'),d('library','Library','library'),d('rec','Recordings','audio-lines')]}</SidebarSection>
      <SidebarSection title="Automation">{[d('sched','Schedules','calendar'),d('flows','Flows','git-branch')]}</SidebarSection>
      <SidebarSection title="Tools">{[d('skills','Skills','graduation-cap')]}</SidebarSection>
      <div style={{flex:1}}/>
      <PersonaFooter name="Toby" imageSrc="../../assets/personas/toby.png" status="connected"/>
    </div>
    <div className="col">
      <SidebarRow title="Calendar Summary" subtitle="Fetch upcoming events" badge="Built-in" glyph={<I n="calendar" s={14}/>} selected={row==='cal'} onClick={()=>setRow('cal')}/>
      <SidebarRow title="Email Summary" subtitle="Fetch unread inbox items" badge="Built-in" glyph={<I n="mail" s={14}/>} selected={row==='mail'} onClick={()=>setRow('mail')}/>
      <SidebarRow title="Tasks Summary" subtitle="Fetch open tasks" badge="Built-in" glyph={<I n="list-todo" s={14}/>} selected={row==='tasks'} onClick={()=>setRow('tasks')}/>
    </div>
  </React.Fragment>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Card/>);
requestAnimationFrame(()=>lucide.createIcons());
</script></body></html>
