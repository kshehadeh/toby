<!-- @dsCard group="Colors" viewport="700x130" name="Accent washes" subtitle="How accent is applied: opacity, never new hues" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>Accent washes</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--font-system);color:var(--text-body);background:var(--surface-settings-canvas);padding:16px}
.g{display:flex;flex-wrap:wrap;gap:10px}.sw{width:96px}.sw i{display:block;height:44px;border-radius:6px;border:1px solid var(--border-hairline)}
.sw b{display:block;font-size:10px;font-weight:600;margin-top:6px;color:var(--text-body)}.sw s{display:block;font-size:9px;text-decoration:none;color:var(--text-faint);font-family:var(--font-mono)}
s{text-decoration:none}a{color:var(--text-accent)}a:hover{color:var(--text-body)}.b{width:150px;height:56px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-body)}</style></head><body><div class="g">
<div><div class="b" style="background:var(--accent-wash-weak)">10% wash</div><s style="font-size:9px;color:var(--text-faint);font-family:var(--font-mono)">--accent-wash-weak</s></div>
<div><div class="b" style="background:var(--accent-wash)">18% hover</div><s style="font-size:9px;color:var(--text-faint);font-family:var(--font-mono)">--accent-wash</s></div>
<div><div class="b" style="background:var(--accent-wash-strong)">22% selected</div><s style="font-size:9px;color:var(--text-faint);font-family:var(--font-mono)">--accent-wash-strong</s></div>
<div><div class="b" style="background:transparent;border:1px solid var(--accent-border)">55% border</div><s style="font-size:9px;color:var(--text-faint);font-family:var(--font-mono)">--accent-border</s></div>
<div><div class="b" style="background:var(--toby-accent);color:var(--text-on-accent);font-weight:600">Solid + dark label</div><s style="font-size:9px;color:var(--text-faint);font-family:var(--font-mono)">--toby-accent</s></div>
</div></body></html>
