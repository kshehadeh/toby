<!-- @dsCard group="Colors" viewport="700x120" name="Accent presets" subtitle="Eight user-selectable accents; orange is default" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>Accents</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--font-system);color:var(--text-body);background:var(--surface-settings-canvas);padding:16px}
.g{display:flex;flex-wrap:wrap;gap:10px}.sw{width:96px}.sw i{display:block;height:44px;border-radius:6px;border:1px solid var(--border-hairline)}
.sw b{display:block;font-size:10px;font-weight:600;margin-top:6px;color:var(--text-body)}.sw s{display:block;font-size:9px;text-decoration:none;color:var(--text-faint);font-family:var(--font-mono)}
s{text-decoration:none}a{color:var(--text-accent)}a:hover{color:var(--text-body)}</style></head><body><div class="g">
<div class="sw"><i style="background:var(--toby-accent-orange)"></i><b>Orange ◂ default</b><s>#f59e1f</s></div>
<div class="sw"><i style="background:var(--toby-accent-blue)"></i><b>Blue</b><s>#408cf2</s></div>
<div class="sw"><i style="background:var(--toby-accent-green)"></i><b>Green</b><s>#40bf73</s></div>
<div class="sw"><i style="background:var(--toby-accent-purple)"></i><b>Purple</b><s>#9e6bf2</s></div>
<div class="sw"><i style="background:var(--toby-accent-pink)"></i><b>Pink</b><s>#eb66a6</s></div>
<div class="sw"><i style="background:var(--toby-accent-red)"></i><b>Red</b><s>#e65959</s></div>
<div class="sw"><i style="background:var(--toby-accent-teal)"></i><b>Teal</b><s>#33b8b8</s></div>
<div class="sw"><i style="background:var(--toby-accent-gray)"></i><b>Gray</b><s>#8c949e</s></div>
</div></body></html>
