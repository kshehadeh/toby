<!-- @dsCard group="Colors" viewport="700x120" name="Destination hues" subtitle="Fixed identity color per sidebar destination" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>Routes</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--font-system);color:var(--text-body);background:var(--surface-settings-canvas);padding:16px}
.g{display:flex;flex-wrap:wrap;gap:10px}.sw{width:96px}.sw i{display:block;height:44px;border-radius:6px;border:1px solid var(--border-hairline)}
.sw b{display:block;font-size:10px;font-weight:600;margin-top:6px;color:var(--text-body)}.sw s{display:block;font-size:9px;text-decoration:none;color:var(--text-faint);font-family:var(--font-mono)}
s{text-decoration:none}a{color:var(--text-accent)}a:hover{color:var(--text-body)}</style></head><body><div class="g">
<div class="sw"><i style="background:var(--toby-route-dashboard)"></i><b>Dashboard</b><s>accent</s></div>
<div class="sw"><i style="background:var(--toby-route-chats)"></i><b>Chats</b><s>#59adff</s></div>
<div class="sw"><i style="background:var(--toby-route-integrations)"></i><b>Integrations</b><s>#52d17a</s></div>
<div class="sw"><i style="background:var(--toby-route-projects)"></i><b>Projects</b><s>#f2b347</s></div>
<div class="sw"><i style="background:var(--toby-route-skills)"></i><b>Skills</b><s>#b885ff</s></div>
<div class="sw"><i style="background:var(--toby-route-memories)"></i><b>Memories</b><s>#eb94db</s></div>
<div class="sw"><i style="background:var(--toby-route-flows)"></i><b>Flows</b><s>#61b8db</s></div>
<div class="sw"><i style="background:var(--toby-route-recordings)"></i><b>Recordings</b><s>#ff5c6b</s></div>
</div></body></html>
