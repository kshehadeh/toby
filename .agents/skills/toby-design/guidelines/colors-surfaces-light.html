<!-- @dsCard group="Colors" viewport="700x120" name="Surfaces · light" subtitle="Sidebar, content, panel, elevated, card" -->
<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta charset="utf-8"><title>Surfaces light</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--font-system);color:var(--text-body);background:var(--surface-settings-canvas);padding:16px}
.g{display:flex;flex-wrap:wrap;gap:10px}.sw{width:96px}.sw i{display:block;height:44px;border-radius:6px;border:1px solid var(--border-hairline)}
.sw b{display:block;font-size:10px;font-weight:600;margin-top:6px;color:var(--text-body)}.sw s{display:block;font-size:9px;text-decoration:none;color:var(--text-faint);font-family:var(--font-mono)}
s{text-decoration:none}a{color:var(--text-accent)}a:hover{color:var(--text-body)}</style></head><body><div class="g">
<div class="sw"><i style="background:var(--surface-sidebar)"></i><b>Sidebar</b><s>#f2f2f5</s></div>
<div class="sw"><i style="background:var(--surface-content)"></i><b>Content</b><s>#fcfcfc</s></div>
<div class="sw"><i style="background:var(--surface-panel)"></i><b>Panel</b><s>#f0f0f2</s></div>
<div class="sw"><i style="background:var(--surface-elevated)"></i><b>Elevated</b><s>#f7f7fa</s></div>
<div class="sw"><i style="background:var(--surface-settings-canvas)"></i><b>Settings canvas</b><s>#f5f5f7</s></div>
<div class="sw"><i style="background:var(--surface-card)"></i><b>Card</b><s>#ffffff</s></div>
</div></body></html>
