<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>Syntax</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--font-system);color:var(--text-body);background:var(--surface-settings-canvas);padding:16px}
.g{display:flex;flex-wrap:wrap;gap:10px}.sw{width:96px}.sw i{display:block;height:44px;border-radius:6px;border:1px solid var(--border-hairline)}
.sw b{display:block;font-size:10px;font-weight:600;margin-top:6px;color:var(--text-body)}.sw s{display:block;font-size:9px;text-decoration:none;color:var(--text-faint);font-family:var(--font-mono)}
s{text-decoration:none}a{color:var(--text-accent)}a:hover{color:var(--text-body)}pre{margin:0;font-family:var(--font-mono);font-size:11px;line-height:1.7;background:var(--toby-log-bg);border:1px solid var(--border-hairline);border-radius:6px;padding:12px}</style></head><body><div style="display:flex;gap:16px"><pre style="flex:1">{
  <span style="color:var(--toby-json-key)">"tool"</span>: <span style="color:var(--toby-json-string)">"search_mail"</span>,
  <span style="color:var(--toby-json-key)">"ms"</span>: <span style="color:var(--toby-json-number)">1412</span>,
  <span style="color:var(--toby-json-key)">"cacheHit"</span>: <span style="color:var(--toby-json-bool)">true</span>
}</pre>
<div style="flex:1;font-size:12px;line-height:1.7;color:var(--toby-md-primary)">
<div style="color:var(--toby-md-heading);font-weight:600">NEEDS ATTENTION</div>
<div>Body copy, <b style="color:var(--toby-md-bold)">bold spans</b>, and <code style="background:var(--toby-md-code-bg);color:var(--toby-md-code);padding:1px 4px;border-radius:4px">inline code</code>.</div>
<div style="color:var(--toby-md-marker)">• list markers recede</div>
</div></div></body></html>
