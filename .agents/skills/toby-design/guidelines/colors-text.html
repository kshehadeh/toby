<!-- @dsCard group="Colors" viewport="700x150" name="Text & lines" subtitle="Alpha-based text tiers and hairlines" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>Text</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--font-system);color:var(--text-body);background:var(--surface-settings-canvas);padding:16px}
.g{display:flex;flex-wrap:wrap;gap:10px}.sw{width:96px}.sw i{display:block;height:44px;border-radius:6px;border:1px solid var(--border-hairline)}
.sw b{display:block;font-size:10px;font-weight:600;margin-top:6px;color:var(--text-body)}.sw s{display:block;font-size:9px;text-decoration:none;color:var(--text-faint);font-family:var(--font-mono)}
s{text-decoration:none}a{color:var(--text-accent)}a:hover{color:var(--text-body)}.row{display:flex;gap:28px;align-items:flex-start}.col{flex:1}p{margin:0 0 6px}.t{font-size:13px}.m{font-size:11px;font-family:var(--font-mono);color:var(--text-faint)}hr{border:none;height:1px;background:var(--border-hairline);margin:10px 0}</style></head><body><div class="row"><div class="col">
<p class="t" style="color:var(--text-body)">Primary — 88% alpha<span class="m"> --text-body</span></p>
<p class="t" style="color:var(--text-muted)">Secondary — 55% / 58%<span class="m"> --text-muted</span></p>
<p class="t" style="color:var(--text-faint)">Tertiary — 38%<span class="m"> --text-faint</span></p>
<p class="t" style="color:var(--text-accent)">Accent text<span class="m"> --text-accent</span></p>
</div><div class="col">
<p class="m">--border-hairline (10% / 8%)</p><hr>
<p class="m">--border-card (8% / 7%)</p><div style="height:1px;background:var(--border-card)"></div>
<p class="m" style="margin-top:10px">--surface-selected (6% / 8%)</p><div style="height:24px;border-radius:6px;background:var(--surface-selected)"></div>
</div></div></body></html>
