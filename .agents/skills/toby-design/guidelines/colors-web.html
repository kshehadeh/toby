<!-- @dsCard group="Colors" viewport="700x120" name="Help site palette" subtitle="Dark-only docs theme; hotter orange than the app" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>Web palette</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--font-system);color:var(--text-body);background:var(--surface-settings-canvas);padding:16px}
.g{display:flex;flex-wrap:wrap;gap:10px}.sw{width:96px}.sw i{display:block;height:44px;border-radius:6px;border:1px solid var(--border-hairline)}
.sw b{display:block;font-size:10px;font-weight:600;margin-top:6px;color:var(--text-body)}.sw s{display:block;font-size:9px;text-decoration:none;color:var(--text-faint);font-family:var(--font-mono)}
s{text-decoration:none}a{color:var(--text-accent)}a:hover{color:var(--text-body)}</style></head><body><div class="g">
<div class="sw"><i style="background:var(--web-black)"></i><b>Black</b><s>#000000</s></div>
<div class="sw"><i style="background:var(--web-surface)"></i><b>Surface</b><s>#0a0a0a</s></div>
<div class="sw"><i style="background:var(--web-surface-raised)"></i><b>Raised</b><s>#141414</s></div>
<div class="sw"><i style="background:var(--web-border)"></i><b>Border</b><s>#262626</s></div>
<div class="sw"><i style="background:var(--web-text)"></i><b>Text</b><s>#fafafa</s></div>
<div class="sw"><i style="background:var(--web-text-muted)"></i><b>Muted</b><s>#a3a3a3</s></div>
<div class="sw"><i style="background:var(--web-accent)"></i><b>Accent</b><s>#f97316</s></div>
</div></body></html>
