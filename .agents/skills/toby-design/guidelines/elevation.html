<!-- @dsCard group="Spacing" viewport="700x150" name="Elevation" subtitle="Flat by default; shadows only for floating chrome" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--font-system);color:var(--text-body);background:var(--surface-settings-canvas);padding:16px}
.g{display:flex;flex-wrap:wrap;gap:10px}.sw{width:96px}.sw i{display:block;height:44px;border-radius:6px;border:1px solid var(--border-hairline)}
.sw b{display:block;font-size:10px;font-weight:600;margin-top:6px;color:var(--text-body)}.sw s{display:block;font-size:9px;text-decoration:none;color:var(--text-faint);font-family:var(--font-mono)}
s{text-decoration:none}a{color:var(--text-accent)}a:hover{color:var(--text-body)}.g3{display:flex;gap:18px}.p{flex:1;height:74px;border-radius:16px;background:var(--surface-elevated);border:1px solid var(--border-hairline);display:flex;align-items:center;justify-content:center;font-size:10px;font-family:var(--font-mono);color:var(--text-faint);text-align:center}</style></head><body><div class="g3">
<div class="p" style="box-shadow:none">--shadow-none<br>lists, cards, rows</div>
<div class="p" style="box-shadow:var(--shadow-card-expanded)">--shadow-card-expanded</div>
<div class="p" style="box-shadow:var(--shadow-toast)">--shadow-toast</div>
<div class="p" style="box-shadow:var(--shadow-popover)">--shadow-popover</div>
<div class="p" style="box-shadow:var(--shadow-dock)">--shadow-dock</div>
</div></body></html>
