<!-- @dsCard group="Spacing" viewport="700x130" name="Motion" subtitle="Short ease-outs, no bounce, no press-scale" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>Motion</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--font-system);color:var(--text-body);background:var(--surface-settings-canvas);padding:16px}
.g{display:flex;flex-wrap:wrap;gap:10px}.sw{width:96px}.sw i{display:block;height:44px;border-radius:6px;border:1px solid var(--border-hairline)}
.sw b{display:block;font-size:10px;font-weight:600;margin-top:6px;color:var(--text-body)}.sw s{display:block;font-size:9px;text-decoration:none;color:var(--text-faint);font-family:var(--font-mono)}
s{text-decoration:none}a{color:var(--text-accent)}a:hover{color:var(--text-body)}table{border-collapse:collapse;font-size:11px}td{padding:3px 18px 3px 0;color:var(--text-muted)}td.m{font-family:var(--font-mono);color:var(--text-faint)}</style></head><body><table>
<tr><td class="m">80ms</td><td>popover dismiss</td><td class="m">--dur-exit</td></tr>
<tr><td class="m">120ms</td><td>hover tint, help reveal, web transitions</td><td class="m">--dur-hover</td></tr>
<tr><td class="m">200ms</td><td>show more / disclosure</td><td class="m">--dur-expand</td></tr>
<tr><td class="m">250ms</td><td>dashboard reflow</td><td class="m">--dur-section</td></tr>
<tr><td class="m">850ms ↔</td><td>attention pulse (autoreverses forever)</td><td class="m">--dur-pulse</td></tr>
<tr><td class="m">600ms</td><td>hover dwell before help popover</td><td class="m">--delay-help</td></tr>
</table></body></html>
