<!-- @dsCard group="Spacing" viewport="700x180" name="Density in use" subtitle="Spacious by default: 22px card padding, 42px rows" -->
<!DOCTYPE html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><title>Density</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{font-family:var(--font-system);color:var(--text-body);background:var(--surface-settings-canvas);padding:16px}
.g{display:flex;flex-wrap:wrap;gap:10px}.sw{width:96px}.sw i{display:block;height:44px;border-radius:6px;border:1px solid var(--border-hairline)}
.sw b{display:block;font-size:10px;font-weight:600;margin-top:6px;color:var(--text-body)}.sw s{display:block;font-size:9px;text-decoration:none;color:var(--text-faint);font-family:var(--font-mono)}
s{text-decoration:none}a{color:var(--text-accent)}a:hover{color:var(--text-body)}</style></head><body><div style="display:flex;gap:16px">
<div style="flex:1;background:var(--surface-panel);border:1px solid var(--border-hairline);border-radius:16px;padding:22px">
<div style="font-size:15px;font-weight:600">Card padding 22</div>
<div style="height:1px;background:var(--border-hairline);margin:14px 0 16px"></div>
<div style="font-size:13px;color:var(--text-muted);line-height:1.55">Divider sits 14px below the header and 16px above the body. Cards never crowd their contents.</div>
</div>
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-card);border-radius:10px;overflow:hidden">
<div style="display:flex;align-items:center;min-height:42px;padding:8px 10px"><div style="flex:1"><div style="font-size:13px;font-weight:600">Row height 42</div><div style="font-size:11px;color:var(--text-row-description)">10px horizontal, 8px vertical padding</div></div></div>
<div style="height:1px;background:var(--border-card);margin-left:10px"></div>
<div style="display:flex;align-items:center;min-height:42px;padding:8px 10px"><div style="font-size:13px;font-weight:600">Second row</div></div>
</div></div></body></html>
