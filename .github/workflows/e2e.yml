name: Swift UI Tests

on:
  pull_request:

jobs:
  viewinspector:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Run Swift tests
        run: swift test --package-path apps/toby-app
