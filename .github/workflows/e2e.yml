name: Swift UI Tests

on:
  pull_request:

jobs:
  viewinspector:
    runs-on: macos-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache SwiftPM binary artifacts
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/org.swift.swiftpm/artifacts
          key: swiftpm-artifacts-${{ hashFiles('apps/toby-app/Package.resolved') }}

      - name: Prefetch Sparkle binary artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/prefetch-sparkle-spm-artifact.sh

      - name: Run Swift tests
        run: swift test --package-path apps/toby-app
