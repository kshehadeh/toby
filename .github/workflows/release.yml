# Build macOS release archives and attach them to a GitHub Release when you push a version tag (e.g. v0.2.0).
#
# Prerequisites: default GITHUB_TOKEN with contents: write (enabled for tags on the repo).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            swift_arch: arm64
            asset: toby-darwin-arm64.zip
          - os: macos-latest
            target: bun-darwin-x64
            swift_arch: x86_64
            asset: toby-darwin-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build Toby binary
        run: mkdir -p dist && bun build ./src/cli.ts --compile --target=${{ matrix.target }} --outfile dist/toby

      - name: Build listener helper
        run: |
          swift build -c release --arch ${{ matrix.swift_arch }} --package-path helpers/toby-audio-helper
          helper_bin="$(swift build --show-bin-path -c release --arch ${{ matrix.swift_arch }} --package-path helpers/toby-audio-helper)/toby-audio-helper"
          cp "$helper_bin" dist/toby-listener

      - name: Check signing configuration
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          [ -n "$CSC_LINK" ] || missing+=("CSC_LINK")
          [ -n "$CSC_KEY_PASSWORD" ] || missing+=("CSC_KEY_PASSWORD")
          [ -n "$APPLE_ID" ] || missing+=("APPLE_ID")
          [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] || missing+=("APPLE_APP_SPECIFIC_PASSWORD")
          [ -n "$APPLE_TEAM_ID" ] || missing+=("APPLE_TEAM_ID")
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing and notarization are enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping signing and notarization. Missing secrets: ${missing[*]}"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          keychain_path="$RUNNER_TEMP/toby-signing.keychain-db"
          cert_path="$RUNNER_TEMP/developer-id.p12"
          echo "$CSC_LINK" | base64 --decode > "$cert_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$cert_path" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"

      - name: Sign release binaries
        if: steps.signing.outputs.enabled == 'true'
        run: |
          identity="$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "Developer ID Application identity not found" >&2
            exit 1
          fi
          codesign --force --options runtime --timestamp --sign "$identity" dist/toby
          codesign --force --options runtime --timestamp --sign "$identity" dist/toby-listener
          codesign --verify --strict --verbose=2 dist/toby
          codesign --verify --strict --verbose=2 dist/toby-listener

      - name: Package release archive
        run: |
          chmod +x dist/toby dist/toby-listener
          rm -rf release-payload
          mkdir release-payload
          cp dist/toby dist/toby-listener release-payload/
          ditto -c -k --sequesterRsrc release-payload ${{ matrix.asset }}

      - name: Notarize release archive
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit ${{ matrix.asset }} \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: toby-*
          merge-multiple: true

      - name: List release files
        run: ls -la release-assets/

      - name: Build release notes from commits since previous tag
        run: |
          python - <<'PY'
          import os
          import subprocess

          current_tag = os.environ.get("GITHUB_REF_NAME", "")

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          all_tags_output = git("tag", "--sort=-creatordate")
          all_tags = [tag for tag in all_tags_output.splitlines() if tag]
          previous_tag = next((tag for tag in all_tags if tag != current_tag), "")

          if previous_tag:
              commit_lines = git(
                  "log",
                  f"{previous_tag}..{current_tag}",
                  "--pretty=format:- %s (%h)",
              )
              heading = f"## Changes since {previous_tag}\n"
              compare_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/compare/{previous_tag}...{current_tag}"
              compare = f"\n[Full diff]({compare_url})\n"
          else:
              commit_lines = git(
                  "log",
                  current_tag,
                  "--pretty=format:- %s (%h)",
              )
              heading = "## Changes in this release\n"
              compare = ""

          body = heading + "\n" + (commit_lines if commit_lines else "- No commit messages found.") + "\n" + compare

          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(body)
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: release-assets/toby-*
