# Build macOS release archives and attach them to a GitHub Release when you push a version tag (e.g. v0.2.0).
#
# Prerequisites: default GITHUB_TOKEN with contents: write (enabled for tags on the repo).

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build release artifacts
        env:
          BUN_TARGET: bun-darwin-arm64
          SWIFT_ARCH: arm64
          TOBY_APP_BUILD_NUMBER: ${{ github.run_number }}
          TOBY_SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
        run: chmod +x scripts/build-release-artifacts.sh && ./scripts/build-release-artifacts.sh

      - name: Check signing configuration
        id: signing
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=()
          [ -n "$CSC_LINK" ] || missing+=("CSC_LINK")
          [ -n "$CSC_KEY_PASSWORD" ] || missing+=("CSC_KEY_PASSWORD")
          [ -n "$APPLE_ID" ] || missing+=("APPLE_ID")
          [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] || missing+=("APPLE_APP_SPECIFIC_PASSWORD")
          [ -n "$APPLE_TEAM_ID" ] || missing+=("APPLE_TEAM_ID")
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Signing and notarization are enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping signing and notarization. Missing secrets: ${missing[*]}"
          fi

      - name: Check Sparkle configuration
        id: sparkle
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          missing=()
          [ -n "$SPARKLE_PUBLIC_KEY" ] || missing+=("SPARKLE_PUBLIC_KEY")
          [ -n "$SPARKLE_PRIVATE_KEY" ] || missing+=("SPARKLE_PRIVATE_KEY")
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Sparkle appcast generation is enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Skipping Sparkle appcast generation. Missing secrets: ${missing[*]}"
          fi

      - name: Import Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          keychain_path="$RUNNER_TEMP/toby-signing.keychain-db"
          cert_path="$RUNNER_TEMP/developer-id.p12"
          echo "$CSC_LINK" | base64 --decode > "$cert_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$cert_path" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | sed s/\"//g)
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"

      - name: Sign release binaries
        if: steps.signing.outputs.enabled == 'true'
        run: |
          identity="$(security find-identity -v -p codesigning | awk -F '"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "Developer ID Application identity not found" >&2
            exit 1
          fi

          # Sign standalone binaries in dist/
          codesign --force --options runtime --timestamp --sign "$identity" dist/toby
          codesign --force --options runtime --timestamp --sign "$identity" dist/bun

          # Sign executables bundled inside Toby.app/Contents/Resources/
          # codesign --deep does NOT traverse Contents/Resources/ (non-standard
          # code location), so each binary must be signed individually.
          APP_RESOURCES="dist/Toby.app/Contents/Resources"
          for bin in \
            "$APP_RESOURCES/toby" \
            "$APP_RESOURCES/bun" \
            "$APP_RESOURCES/toby-listener"; do
            [[ -f "$bin" ]] || continue
            codesign --force --options runtime --timestamp --sign "$identity" "$bin"
          done

          # Sparkle is copied manually by scripts/build-app.sh. Sign nested
          # executables before signing the framework and app bundle.
          SPARKLE_FRAMEWORK="dist/Toby.app/Contents/Frameworks/Sparkle.framework"
          if [[ -d "$SPARKLE_FRAMEWORK" ]]; then
            SPARKLE_VERSION_DIR="$SPARKLE_FRAMEWORK/Versions/B"
            for sparkle_bin in \
              "$SPARKLE_VERSION_DIR/Autoupdate" \
              "$SPARKLE_VERSION_DIR/Updater.app" \
              "$SPARKLE_VERSION_DIR/XPCServices/Downloader.xpc" \
              "$SPARKLE_VERSION_DIR/XPCServices/Installer.xpc"; do
              [[ -e "$sparkle_bin" ]] || continue
              codesign --force --options runtime --timestamp --sign "$identity" "$sparkle_bin"
            done
            codesign --force --options runtime --timestamp --sign "$identity" "$SPARKLE_FRAMEWORK"
          fi

          # Resource bundles (.bundle) are SPM resource-only bundles with no
          # Mach-O code, so codesign cannot sign them and notarization doesn't
          # require it. Skip them.

          # Finally, sign the app bundle itself (without --deep; nested code is already signed)
          codesign --force --options runtime --timestamp \
            --entitlements apps/toby-app/TobyApp.entitlements \
            --sign "$identity" dist/Toby.app

          # Verify all signatures
          codesign --verify --strict --verbose=2 dist/Toby.app
          codesign --verify --strict --verbose=2 dist/toby
          codesign --verify --strict --verbose=2 dist/bun

      - name: Notarize Toby.app
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          ditto -c -k --keepParent dist/Toby.app dist/Toby.app.notary.zip
          # Submit and wait; notarytool --wait exits 0 even when notarization
          # is rejected, so parse the status from the output directly.
          submit_output="$(xcrun notarytool submit dist/Toby.app.notary.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1)"
          echo "$submit_output"

          # Extract the first submission ID (appears multiple times in output)
          submission_id="$(echo "$submit_output" | grep -m1 'id:' | awk '{print $2}')"
          # Extract the final status from the output
          status="$(echo "$submit_output" | grep 'status:' | tail -1 | awk '{print $2}')"
          echo "Notarization status: $status"

          if [[ "$status" != "Accepted" ]]; then
            echo "Notarization was NOT accepted. Fetching log..." >&2
            if [[ -n "$submission_id" ]]; then
              xcrun notarytool log "$submission_id" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" >&2
            fi
            exit 1
          fi

      - name: Staple notarization ticket to Toby.app
        if: steps.signing.outputs.enabled == 'true'
        run: |
          xcrun stapler staple dist/Toby.app
          xcrun stapler validate dist/Toby.app

      - name: Build DMG
        run: |
          chmod +x scripts/build-dmg.sh
          ./scripts/build-dmg.sh arm64

      - name: Notarize DMG
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          submit_output="$(xcrun notarytool submit dist/Toby-arm64.dmg \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait 2>&1)"
          echo "$submit_output"

          submission_id="$(echo "$submit_output" | grep -m1 'id:' | awk '{print $2}')"
          status="$(echo "$submit_output" | grep 'status:' | tail -1 | awk '{print $2}')"
          echo "DMG notarization status: $status"

          if [[ "$status" != "Accepted" ]]; then
            echo "DMG notarization was NOT accepted. Fetching log..." >&2
            if [[ -n "$submission_id" ]]; then
              xcrun notarytool log "$submission_id" \
                --apple-id "$APPLE_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD" \
                --team-id "$APPLE_TEAM_ID" >&2
            fi
            exit 1
          fi

          xcrun stapler staple dist/Toby-arm64.dmg

      - name: Generate Sparkle appcast
        if: steps.signing.outputs.enabled == 'true' && steps.sparkle.outputs.enabled == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          sparkle_dir="$RUNNER_TEMP/sparkle"
          sparkle_zip="$RUNNER_TEMP/sparkle.zip"
          curl -fsSL https://github.com/sparkle-project/Sparkle/releases/download/2.9.3/Sparkle-for-Swift-Package-Manager.zip -o "$sparkle_zip"
          unzip -q "$sparkle_zip" -d "$sparkle_dir"

          appcast_input="$RUNNER_TEMP/toby-appcast"
          mkdir -p "$appcast_input"
          cp dist/Toby-arm64.dmg "$appcast_input/Toby-arm64.dmg"

          download_prefix="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"
          printf '%s' "$SPARKLE_PRIVATE_KEY" | \
            "$sparkle_dir/bin/generate_appcast" \
              --ed-key-file - \
              --download-url-prefix "$download_prefix" \
              --maximum-versions 1 \
              -o dist/appcast.xml \
              "$appcast_input"

      - name: Upload appcast artifact
        if: steps.signing.outputs.enabled == 'true' && steps.sparkle.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: appcast.xml
          path: dist/appcast.xml

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Toby-arm64.dmg
          path: dist/Toby-arm64.dmg

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history for tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download DMG
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          name: Toby-arm64.dmg

      - name: Download appcast
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          name: appcast.xml
        continue-on-error: true

      - name: List release files
        run: ls -la release-assets/

      - name: Build release notes from commits since previous tag
        run: |
          python - <<'PY'
          import os
          import subprocess

          current_tag = os.environ.get("GITHUB_REF_NAME", "")

          def git(*args: str) -> str:
              return subprocess.check_output(["git", *args], text=True).strip()

          all_tags_output = git("tag", "--sort=-creatordate")
          all_tags = [tag for tag in all_tags_output.splitlines() if tag]
          previous_tag = next((tag for tag in all_tags if tag != current_tag), "")

          if previous_tag:
              commit_lines = git(
                  "log",
                  f"{previous_tag}..{current_tag}",
                  "--pretty=format:- %s (%h)",
              )
              heading = f"## Changes since {previous_tag}\n"
              compare_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/compare/{previous_tag}...{current_tag}"
              compare = f"\n[Full diff]({compare_url})\n"
          else:
              commit_lines = git(
                  "log",
                  current_tag,
                  "--pretty=format:- %s (%h)",
              )
              heading = "## Changes in this release\n"
              compare = ""

          body = heading + "\n" + (commit_lines if commit_lines else "- No commit messages found.") + "\n" + compare

          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(body)
          PY

      - name: Collect release files
        id: release_files
        run: |
          files="release-assets/Toby-arm64.dmg"
          if [[ -f release-assets/appcast.xml ]]; then
            files="${files}"$'\n'"release-assets/appcast.xml"
          fi
          {
            echo "files<<EOF"
            printf '%s\n' "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          files: ${{ steps.release_files.outputs.files }}

  deploy_pages:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pages: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download appcast
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          name: appcast.xml
        continue-on-error: true

      - name: Configure Pages
        if: hashFiles('release-assets/appcast.xml') != ''
        uses: actions/configure-pages@v5

      - name: Setup Bun for Pages appcast deploy
        if: hashFiles('release-assets/appcast.xml') != ''
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"

      - name: Install dependencies for Pages appcast deploy
        if: hashFiles('release-assets/appcast.xml') != ''
        run: bun install --frozen-lockfile

      - name: Build help site with Sparkle appcast
        if: hashFiles('release-assets/appcast.xml') != ''
        run: |
          bunx turbo run build --filter @toby/help-site
          cp release-assets/appcast.xml apps/help-site/build/appcast.xml

      - name: Upload Pages appcast artifact
        if: hashFiles('release-assets/appcast.xml') != ''
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/help-site/build

      - name: Deploy Pages appcast artifact
        id: deployment
        if: hashFiles('release-assets/appcast.xml') != ''
        uses: actions/deploy-pages@v5
