<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="980" viewBox="0 0 1060 980" role="img" aria-labelledby="title desc">
  <title id="title">Toby high-level architecture</title>
  <desc id="desc">A layered architecture diagram showing Toby user surfaces, the core harness, installable plugins, and external systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4f8"/>
    </linearGradient>
    <linearGradient id="surface" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="core" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="plugin" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#be123c"/>
      <stop offset="1" stop-color="#9d174d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="8.4" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .page { fill: url(#bg); }
      .title { font: 700 38px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .subtitle { font: 500 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; letter-spacing: 0; }
      .eyebrow { font: 700 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: 1.8px; }
      .layer-label { font: 700 22px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; letter-spacing: 0; }
      .layer-note { font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: rgba(255,255,255,0.78); letter-spacing: 0; }
      .card-title { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; letter-spacing: 0; }
      .card-text { font: 500 13.5px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #475569; letter-spacing: 0; }
      .card-code { font: 600 13px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #334155; letter-spacing: 0; }
      .white-title { font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; letter-spacing: 0; }
      .white-text { font: 500 13.5px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: rgba(255,255,255,0.82); letter-spacing: 0; }
      .pill { fill: #ffffff; stroke: #dbe4ee; stroke-width: 1.2; }
      .panel { fill: #ffffff; stroke: #dbe4ee; stroke-width: 1.3; }
      .soft { fill: #f8fafc; stroke: #dbe4ee; stroke-width: 1.1; }
      .line { fill: none; stroke: #64748b; stroke-width: 2.2; marker-end: url(#arrow); }
      .line-dark { fill: none; stroke: #334155; stroke-width: 2.3; marker-end: url(#arrowDark); }
      .tiny { font: 700 11px Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; letter-spacing: 1.2px; }
    </style>
  </defs>

  <rect class="page" width="1060" height="980"/>

  <text x="80" y="82" class="eyebrow">TOBY ARCHITECTURE</text>
  <text x="80" y="126" class="title">Toby Module Organization</text>
  <text x="80" y="160" class="subtitle">Toby's app surfaces present the experience; the core package runs chat, AI, config, persistence, and integrations.</text>

  <g filter="url(#shadow)">
    <g transform="translate(80 210)">
      <rect width="430" height="104" rx="10" fill="url(#surface)"/>
      <text x="32" y="44" class="layer-label">@toby/cli</text>
      <text x="32" y="72" class="layer-note">CLI</text>
    </g>
    <g transform="translate(550 210)">
      <rect width="430" height="104" rx="10" fill="url(#surface)"/>
      <text x="32" y="44" class="layer-label">@toby/web</text>
      <text x="32" y="72" class="layer-note">Web</text>
    </g>
  </g>

  <path class="line" d="M 295 314 C 295 338 295 338 295 362"/>
  <path class="line" d="M 765 314 C 765 338 765 338 765 362"/>

  <g filter="url(#shadow)">
    <rect x="80" y="362" width="900" height="286" rx="10" fill="url(#core)"/>
    <text x="112" y="403" class="layer-label">@toby/core</text>
    <text x="112" y="429" class="layer-note">UI-agnostic harness used by app surfaces, scripts, daemon flows, and plugins</text>

    <g transform="translate(112 460)">
      <rect width="388" height="74" rx="8" fill="#ffffff" fill-opacity="0.96"/>
      <text x="18" y="30" class="card-title">Chat turn pipeline</text>
      <text x="18" y="54" class="card-text">init, expand, assemble, run, persist</text>
    </g>
    <g transform="translate(560 460)">
      <rect width="388" height="74" rx="8" fill="#ffffff" fill-opacity="0.96"/>
      <text x="18" y="30" class="card-title">AI runtime</text>
      <text x="18" y="54" class="card-text">models, tools, caching</text>
    </g>
    <g transform="translate(112 556)">
      <rect width="388" height="74" rx="8" fill="#ffffff" fill-opacity="0.96"/>
      <text x="18" y="30" class="card-title">Integration registry</text>
      <text x="18" y="54" class="card-text">modules, capabilities, credentials</text>
    </g>
    <g transform="translate(560 556)">
      <rect width="388" height="74" rx="8" fill="#ffffff" fill-opacity="0.96"/>
      <text x="18" y="30" class="card-title">State and context</text>
      <text x="18" y="54" class="card-text">config, sessions, memory, logging</text>
    </g>
  </g>

  <path class="line-dark" d="M 530 648 L 530 688"/>

  <g filter="url(#shadow)">
    <rect x="80" y="688" width="900" height="104" rx="10" fill="url(#plugin)"/>
    <text x="112" y="728" class="layer-label">@toby/plugin-*</text>
    <text x="112" y="754" class="layer-note">CLI Binaries with strict contracts</text>
    <rect x="648" y="711" width="300" height="38" rx="8" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.28)"/>
    <text x="668" y="735" class="white-text">JSON protocol v1 over stdin/stdout</text>
  </g>

  <path class="line" d="M 530 792 L 530 822"/>

  <g filter="url(#shadow)">
    <rect x="80" y="822" width="900" height="94" rx="10" class="panel"/>
    <text x="112" y="860" class="card-title">External systems</text>

    <g transform="translate(112 876)">
      <rect width="124" height="28" rx="8" class="soft"/>
      <g transform="translate(14 8)" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect width="16" height="12" rx="2"/>
        <path d="M 1 2 L 8 7 L 15 2"/>
      </g>
      <text x="40" y="19" class="card-text">Email</text>
    </g>

    <g transform="translate(250 876)">
      <rect width="124" height="28" rx="8" class="soft"/>
      <g transform="translate(14 6)" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 5 3 H 15"/>
        <path d="M 5 8 H 15"/>
        <path d="M 5 13 H 15"/>
        <path d="M 1 3 H 1.5"/>
        <path d="M 1 8 H 1.5"/>
        <path d="M 1 13 H 1.5"/>
      </g>
      <text x="40" y="19" class="card-text">Tasks</text>
    </g>

    <g transform="translate(388 876)">
      <rect width="124" height="28" rx="8" class="soft"/>
      <g transform="translate(14 6)" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 2 2 H 16 V 11 H 8 L 4 15 V 11 H 2 Z"/>
      </g>
      <text x="40" y="19" class="card-text">Chat</text>
    </g>

    <g transform="translate(526 876)">
      <rect width="124" height="28" rx="8" class="soft"/>
      <g transform="translate(14 6)" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="5" width="17" height="11" rx="2"/>
        <path d="M 6 5 V 3 H 13 V 5"/>
        <path d="M 1 10 H 18"/>
      </g>
      <text x="40" y="19" class="card-text">Work</text>
    </g>

    <g transform="translate(664 876)">
      <rect width="124" height="28" rx="8" class="soft"/>
      <g transform="translate(14 6)" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="7" cy="7" r="5"/>
        <path d="M 11 11 L 16 16"/>
      </g>
      <text x="40" y="19" class="card-text">Search</text>
    </g>

    <g transform="translate(802 876)">
      <rect width="124" height="28" rx="8" class="soft"/>
      <g transform="translate(14 5)" fill="none" stroke="#475569" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="1" y="3" width="17" height="15" rx="2"/>
        <path d="M 5 1 V 5"/>
        <path d="M 14 1 V 5"/>
        <path d="M 1 8 H 18"/>
      </g>
      <text x="40" y="19" class="card-text">Calendar</text>
    </g>
  </g>

</svg>
